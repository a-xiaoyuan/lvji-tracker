/* ===== 打击感：纸面 + 粗描边 + 硬阴影 ===== */
:root{--bg:#eceef1;--panel:#fdfdfd;--ink:#16161d;--line:#cfd3da;--text:#16161d;--muted:#5b616d;--soft:#e1e4e9;--accent:#ff2d87;--accent-ink:#c8005a;--accent-soft:#ffe1ee;--ok:#16161d;--warn:#ff2d87;--bad:#ff2d87;
 --bw:2.5px;--hs:4px 4px 0 var(--ink);--hs-lg:6px 6px 0 var(--ink);--shadow:var(--hs);
 --sk-card:var(--panel);--sk-ink:var(--ink);--sk-dim:var(--muted);--sk-soft:var(--soft);--sk-pri:var(--accent);--sk-pri-ink:var(--ink);--sk-acc:var(--accent);--sk-track:var(--soft);--sk-r:9px;--sk-bw:2.5px;--sk-sh:3px 3px 0 var(--ink);--sk-tick:var(--ink);--sk-fill:var(--accent);--sk-on-pri:#16161d;
 --spring:cubic-bezier(.3,1.7,.5,1)}
[data-theme=dark]{--bg:#17161b;--panel:#222027;--ink:#f2ede3;--line:#3b3842;--text:#f2ede3;--muted:#a59f94;--soft:#2c2a31;--accent:#ff4f9c;--accent-ink:#ff7ab5;--accent-soft:#40202f;--ok:#f2ede3;--hs:4px 4px 0 #000;--hs-lg:6px 6px 0 #000;--sk-sh:3px 3px 0 #000}
html,body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.3px);background-size:7px 7px}

}

// 读取如页里的简历（同源 localStorage），按「投递用的简历」名字匹配，找不到就用当前简历
function ruyeDocs(){try{const L=JSON.parse(localStorage.getItem('ruye:documents')||'[]');return Array.isArray(L)?L.filter(x=>x&&x.doc):[];}catch{return [];}}
function ruyeTitle(x){return String(x.doc?.meta?.title||'未命名简历');}
function flatText(o,out=[]){if(typeof o==='string')out.push(o);else if(Array.isArray(o))o.forEach(v=>flatText(v,out));else if(o&&typeof o==='object')for(const [k,v] of Object.entries(o)){if(k==='layout'||k==='id'||k==='updatedAt'||k==='templateId')continue;flatText(v,out);}return out;}
function resumeFor(a){const L=ruyeDocs();if(!L.length)return null;const n=String(a?.resume||'').trim().toLowerCase(),cur=localStorage.getItem('ruye:currentId');
 const x=(n&&L.find(d=>{const t=ruyeTitle(d).toLowerCase();return t===n||t.includes(n)||n.includes(t);}))||L.find(d=>d.id===cur)||L[0];
 return {title:ruyeTitle(x),text:flatText(x.doc).join('\n'),guessed:!n};}
function inResume(k,text){const T=text.toLowerCase(),kl=k.toLowerCase();if(/^[a-z0-9.+#/ -]+$/i.test(k))return new RegExp('(^|[^a-z0-9])'+kl.replace(/[.+#/*?()[\]{}|^$\\]/g,'\\$&')+'(?![a-z0-9+#])','i').test(T);return T.includes(kl);}

 const hit=F.filter(k=>inResume(k,R.text)),miss=F.filter(k=>!inResume(k,R.text)),sc=Math.round(hit.length/F.length*100);
 return `<div class="rm"><div class="jdh"><div class="ring2" style="--p:${sc}"><span><b>${sc}</b>%</span></div><div><div class="t1">简历覆盖度 · 《${esc(R.title)}》${R.guessed?'<span class="t2">（没指定简历，用的是当前简历）</span>':''}</div><div class="t2">JD 里的关键词有 ${hit.length}/${F.length} 个出现在简历中${miss.length?'，会的话可以写进简历，过筛更容易':''}</div></div></div>
 ${miss.length?`<div class="quick">${miss.map(k=>`<span class="tag" style="background:#ff2d8714;color:var(--bad)">缺 ${esc(k)}</span>`).join('')}<button class="btn sm" data-act="copymiss" data-k="${esc(miss.join('、'))}">复制缺的词</button></div>`:'<div class="t2" style="color:var(--ok)">✓ JD 关键词都已出现在简历里</div>'}</div>`;}
function kwFind(text){const T=String(text||'').toLowerCase();if(T.length<8)return [];const found=new Set();
 for(const k of new Set([...KW,...db.skills.map(x=>x.name)])){if(!k)continue;const kl=k.toLowerCase();
  if(/^[a-z0-9.+#/ -]+$/i.test(k)){if(new RegExp('(^|[^a-z0-9])'+kl.replace(/[.+#/*?()[\]{}|^$\\]/g,'\\$&')+'(?![a-z0-9+#])','i').test(T))found.add(k);}
  else if(T.includes(kl))found.add(k);}
 const L=[...found];return L.filter(k=>!L.some(o=>o!==k&&o.toLowerCase().includes(k.toLowerCase())));}
function skillFor(k){const b=k.toLowerCase();return db.skills.find(x=>{const a=x.name.toLowerCase();return a===b||(a.length>1&&b.includes(a))||(b.length>1&&a.includes(b));});}

 const score=Math.round(rows.reduce((t,r)=>t+(r.lv<0?0:Math.min(r.lv,4)/4),0)/rows.length*100);

  if(/^https?:\/\//i.test(t))o.link=t;
  else if(!o.salary&&(/^\d+(\.\d+)?\s*([-~至到]\s*\d+(\.\d+)?)?\s*[kK千万wW]/.test(t)||/^\d+[-~]\d+$/.test(t)||/薪$/.test(t)))o.salary=t;
  else if(!o.city&&CITY.includes(c))o.city=c;

async function ai(o){if(!TOKEN)throw new Error('要从桌面的「履迹」快捷方式打开，才能用 AI');
 let r;try{r=await fetch(AI_URL,{method:'POST',headers:{'content-type':'application/json','x-token':TOKEN},body:JSON.stringify({...o,engine:db.settings.aiEngine||'deepseek'})});}catch{throw new Error('连不上本机小助手，从桌面快捷方式重新打开履迹试试');}

 AIL={engine:j.engine,skipped:j.skipped||[]};return o.json?aiJSON(j.text):j.text;}
function aiJSON(t){t=String(t).replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,'').trim();try{return JSON.parse(t);}catch{const m=t.match(/\{[\s\S]*\}/);if(m)try{return JSON.parse(m[0]);}catch{}throw new Error('AI 返回的格式不对，再试一次');}}

// 轻量 Markdown：标题、粗体、行内代码、列表、引用、代码块、链接
function md(s){const out=[];let list=null,code=false;const close=()=>{if(list){out.push(`</${list}>`);list=null;}};
 const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
  .replace(/(^|[\s（(：:])(https?:\/\/[^\s<）)]+)/g,(m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u.length>48?u.slice(0,46)+'…':u}</a>`);
 for(const raw of esc(s).split(/\r?\n/)){const l=raw.trimEnd();let m;
  if(/^\s*```/.test(l)){close();out.push(code?'</pre>':'<pre>');code=!code;continue;}
  if(code){out.push(l+'\n');continue;}
  if(m=l.match(/^(#{1,4})\s+(.*)/)){close();out.push(`<h4 class="mdh">${inl(m[2])}</h4>`);}
  else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push(`<li>${inl(m[1])}</li>`);}
  else if(m=l.match(/^\s*\d+[.、)]\s*(.*)/)){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push(`<li>${inl(m[1])}</li>`);}
  else if(m=l.match(/^&gt;\s?(.*)/)){close();out.push(`<blockquote>${inl(m[1])}</blockquote>`);}
  else if(/^\s*(-{3,}|\|?\s*:?-{3,})/.test(l)){close();}
  else if(/^\|.*\|$/.test(l)){close();out.push(`<div class="mdrow">${l.slice(1,-1).split('|').map(c=>`<span>${inl(c.trim())}</span>`).join('')}</div>`);}
  else if(!l.trim())close();
  else{close();out.push(`<p>${inl(l)}</p>`);}}
 close();if(code)out.push('</pre>');return `<div class="md">${out.join('')}</div>`;}
const fmtAI=x=>esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function aiTarget(a){const P=db.settings.profile||{};return a&&a.role?a.role:(P.target||'后端开发');}
function appCtx(a){if(!a)return '';return `公司：${a.company}\n岗位：${a.role}${a.city?'\n城市：'+a.city:''}${a.salary?'\n薪资：'+a.salary:''}\n岗位描述 / 备注：\n${(a.notes||'（没有填写）').slice(0,5000)}`;}

function weakCtx(){const R={};for(const a of db.apps){for(const r of a.fail?.reasons||[])R[r]=(R[r]||0)+1;for(const e of a.events)for(const r of e.weak||[])R[r]=(R[r]||0)+1;}
 for(const m of db.mocks)if(!m.aid)for(const r of m.report?.weak||[])R[r]=(R[r]||0)+1;

   events:[ev('interview','一面',T(-5,15),true,{rating:3,questions:'Kafka 分区和消费者组\nSpark 宽依赖与窄依赖\n两数之和 https://leetcode.cn/problems/two-sum/'}),ev('interview','二面',T(1,14),false,{place:'腾讯会议'})]}),
  S({company:'北辰智能（示例）',role:'大模型应用开发',city:'深圳',salary:'30-45K',channel:'牛客',status:'test',priority:1,appliedAt:D(-6),events:[ev('test','笔试',T(0,19),false)]}),
  S({company:'远山网络（示例）',role:'Java 开发',city:'成都',salary:'18-25K',channel:'拉勾',status:'applied',priority:3,appliedAt:D(-10)}),
  S({company:'橙子电商（示例）',role:'后端开发',city:'广州',salary:'20-28K',channel:'Boss直聘',status:'rejected',priority:2,appliedAt:D(-22),events:[ev('interview','一面',T(-16,11),true,{rating:2,questions:'手写快速排序\nTCP 三次握手为什么不是两次',review:'算法题没写出来，要多刷题'})]}),
  S({company:'云杉游戏（示例）',role:'服务端开发',city:'杭州',salary:'25-35K',channel:'猎聘',status:'interview',priority:2,appliedAt:D(-9),events:[ev('interview','一面',T(3,10),false)]}),

/* ========== 启动 ========== */
db=(()=>{const raw=localStorage.getItem(KEY);if(!raw)return normalize({});try{return normalize(JSON.parse(raw));}catch(e){console.error(e);localStorage.setItem(KEY+'_broken_'+Date.now(),raw);return normalize({});}})();
if(db._cleaned){delete db._cleaned;db.savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db));}
if(START_VIEW&&VIEWS.some(v=>v[0]===START_VIEW))view=START_VIEW;
applyTheme();renderSync();render();pull();
setInterval(checkReminders,30000);setTimeout(checkReminders,1500);setInterval(rvPrompt,60000);setTimeout(rvPrompt,4000);
renderFocus();setInterval(tickFocus,1000);
document.addEventListener('paste',e=>{const t=e.target;if(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable||document.getElementById('modal').classList.contains('on')||openId||view==='resume')return;
 const txt=(e.clipboardData?.getData('text')||'').trim();if(!txt)return;e.preventDefault();const lines=txt.split(/\r?\n/).filter(l=>l.trim());
 if(looksInvite(txt))return openInvite(txt);
 if(lines.length>1){bulkText=txt;openAdd('applied','bulk');return toast(`识别到 ${lines.length} 行，已放进批量导入`);}
 if(/^https?:\/\//i.test(txt)){openAdd('applied','one',{link:txt,channel:/zhipin/.test(txt)?'Boss直聘':/lagou/.test(txt)?'拉勾':/liepin/.test(txt)?'猎聘':/nowcoder/.test(txt)?'牛客':'官网'});return toast('链接已填好，补上公司和岗位就行');}
 const o=parseLine(txt);openAdd(o.status||'applied','one',o);});
const INBOX='http://127.0.0.1:47321/api/inbox';let inboxBusy=false;
async function pullInbox(){if(!TOKEN||inboxBusy)return;inboxBusy=true;
 try{const r=await fetch(INBOX,{headers:{'x-token':TOKEN},cache:'no-store'});if(!r.ok)return;const items=(await r.json()).items||[];if(!items.length)return;
  const have=new Set(db.apps.map(a=>a.inboxId).filter(Boolean)),fresh=items.filter(it=>!have.has(it.id));
  const added=[],upd=[],chats=[];
  for(const it of fresh){if(it.kind==='chat'){chats.push(it);continue;}const wish=it.status==='wish';
   const ex=it.company&&db.apps.find(a=>sameCo(a.company,it.company)&&(!it.role||!a.role||coKey(a.role)===coKey(it.role)));
   if(ex){ex.inboxId=it.id;for(const k of ['link','city','salary'])if(!ex[k]&&it[k])ex[k]=it[k];if(it.jd&&!String(ex.notes||'').includes(it.jd.slice(0,40)))ex.notes=[ex.notes,it.jd].filter(Boolean).join('\n\n');if(it.hr&&!ex.contact)ex.contact=it.hr;
    if(!wish&&ex.status==='wish'){ex.appliedAt=dstr(new Date(it.at||Date.now()));setStatus(ex,'applied',true);}touch(ex);upd.push(ex.company);continue;}
   const a=newApp({inboxId:it.id,company:it.company||'未命名公司',role:it.role||'',city:it.city||'',salary:it.salary||'',channel:CH.includes(it.channel)?it.channel:'其他',status:wish?'wish':'applied',appliedAt:wish?'':dstr(new Date(it.at||Date.now())),link:it.link||'',contact:it.hr||'',notes:it.jd||''});logStatus(a,'',a.status);db.apps.push(a);added.push(a.company);}
  let inv=null;const chatMsg=[];
  for(const it of chats){const t=String(it.text||'').trim();if(!t)continue;
   let a=it.company?(db.apps.find(x=>sameCo(x.company,it.company)&&it.role&&coKey(x.role)===coKey(it.role))||db.apps.find(x=>sameCo(x.company,it.company)&&!['rejected','dropped'].includes(x.status))||db.apps.find(x=>sameCo(x.company,it.company))):null;
   if(!a&&it.company){a=newApp({inboxId:it.id,company:it.company,role:it.role||'',channel:'Boss直聘',status:'applied',appliedAt:today(),contact:it.hr||''});logStatus(a,'',a.status);db.apps.push(a);added.push(a.company);}
   if(a){a.notes=[a.notes,`【Boss 聊天 · ${nowLocal().replace('T',' ')}${it.hr?' · '+it.hr:''}】\n${t.slice(0,3000)}`].filter(Boolean).join('\n\n');if(it.hr&&!a.contact)a.contact=it.hr;if(a.status==='wish')setStatus(a,'applied',true);touch(a);}
   if(looksInvite(t))inv={t,aid:a?.id||''};else chatMsg.push(a);}
  if(fresh.length){persist();flushSave();render();
   const msg=[added.length&&`收进 ${added.length} 条：${added.slice(0,5).join('、')}${added.length>5?' 等':''}`,upd.length&&`更新 ${upd.length} 条：${upd.slice(0,3).join('、')}`,chatMsg.length&&`${chatMsg.filter(Boolean).map(a=>a.company).join('、')||'一段'} 聊天已存进备注`].filter(Boolean).join('；');
   if(msg)toast((fresh.every(x=>x.auto)?'🔗 自动记录 · ':'📥 ')+msg,chatMsg[0]?['查看',()=>openDrawer(chatMsg[0].id)]:null,6000);
   if(inv){const go=()=>{openInvite(inv.t,inv.aid);setTimeout(invGo,60);};if(!document.getElementById('modal').classList.contains('on'))go();else toast('📥 收到一段像面试邀请的 Boss 聊天',['识别并建日程',go],20000);}}
  await fetch(INBOX,{method:'DELETE',headers:{'x-token':TOKEN,'content-type':'application/json'},body:JSON.stringify({ids:items.map(x=>x.id)})});
 }catch{}finally{inboxBusy=false;}}
setTimeout(pullInbox,1200);setInterval(()=>{if(!document.hidden)pullInbox();},5000);addEventListener('focus',pullInbox);
setInterval(()=>{if(sync.state!=='ok'&&TOKEN)pull();},60000);
(()=>{const n=allEvents().filter(({e})=>!e.done&&e.at&&e.at.slice(0,10)===today());if(n.length)setTimeout(()=>toast(`📅 今天有 ${n.length} 项安排：${n.map(x=>x.a.company+' '+(x.e.title||EV[x.e.type])).join('、')}`),500);})();
