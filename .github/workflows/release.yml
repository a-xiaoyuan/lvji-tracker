# 推送 v 开头的标签（例如 v2026.11.26）时：先跑测试，再在 Windows 上打安装包，发布到 GitHub Releases。
# 也可以在 Actions 页面手动运行（只打包，不发布，安装包在运行记录的 Artifacts 里下载）。
name: 打包发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行测试
        run: npm test
      - name: 打安装包（含隐私检查）
        shell: powershell
        env:
          LVJI_NO_PAUSE: '1'
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "打包/build.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter '履迹-安装包-*.zip' | Select-Object -First 1
          if (-not $zip) { Write-Error '没有生成安装包'; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $zip.FullName dist/
      - uses: actions/upload-artifact@v4
        with:
          name: 履迹安装包
          path: dist/*.zip
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "履迹 $GITHUB_REF_NAME" --notes "下载下面的安装包 zip，解压后双击「安装或更新.cmd」。需要先装 Node.js 22 或更高版本。"
