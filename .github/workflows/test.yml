# 每次推送和合并请求都跑一遍自动测试（核心函数 + 本机服务接口）
name: 测试
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查扩展和本机服务的语法
        shell: bash
        run: |
          for f in helper/*.mjs extension/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
      - name: 运行测试
        run: npm test
